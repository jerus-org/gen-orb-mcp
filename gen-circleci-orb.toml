[orb]
binary = "gen-orb-mcp"
namespaces = ["jerus-org"]
orb_dir = "orb"
git_push_subcommands = ["save"]
# Native build deps for the runtime image, where build_mcp_server COMPILES the
# generated MCP server crate. Its dep tree (rmcp/reqwest → openssl-sys, aws-lc-sys)
# uses bindgen/cmake, which need libclang + cmake on trixie's newer OpenSSL.
apt_packages = ["build-essential", "clang", "cmake"]
# The Rust executor base and build deps (cargo, gnupg, libssl-dev, pkg-config)
# are provisioned automatically by gen-circleci-orb because [ci].mcp = true.
#
# Pinned Rust images for the generated Dockerfile. mcp = true defaults both the
# builder and runtime stages to an *unpinned* rust:1-slim-trixie, so without
# pinning here the @sha256 digest is stripped on every regeneration (the orb
# Dockerfile is regenerated from this config, not from Renovate's in-Dockerfile
# edit). Pinned here so the digest survives regeneration; Renovate keeps both up
# to date via customManagers (renovate.json), which also disables Renovate's
# dockerfile manager on the generated orb/Dockerfile so this toml is the single
# source of truth. Same image + digest for both stages (both rust:1-slim-trixie).
builder_image = "rust:1-slim-trixie@sha256:f47a8de237dcbb0b0ce1099901e60a89728e3d51f24e664b40e947171538ade7"
base_image = "rust:1-slim-trixie@sha256:f47a8de237dcbb0b0ce1099901e60a89728e3d51f24e664b40e947171538ade7"

# Auto-record: after `generate` regenerates the orb, the regenerate-orb CI job
# GPG-signs a commit of the orb source and pushes it to the PR branch (for
# review), keeping the published orb in sync with the CLI. The values are the
# *names* of the env vars holding the signing material and a contents:write
# GitHub token; the secret values live in the contexts (release -> BOT_*,
# bot-check -> GITHUB_TOKEN). The binary records only on a PR branch.
[record]
enabled = true
gpg_key_env = "BOT_GPG_KEY"
gpg_trust_env = "BOT_TRUST"
user_name_env = "BOT_USER_NAME"
user_email_env = "BOT_USER_EMAIL"
signing_key_env = "BOT_SIGN_KEY"
# Push uses the org SSH write key (loaded by add_ssh_keys in the push job),
# not a token — add_ssh_keys resolves the fingerprint at config-compile time
# and can't read env vars, so this is a value, not an env-var name.
push_ssh_fingerprint = "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
contexts = ["release"]

[ci]
build_workflow = "validation"
release_workflow = "release"
requires_job = "toolkit/common_tests"
release_after_job = "release-gen-orb-mcp"
crate_tag_prefix = "gen-orb-mcp-v"
docker_namespace = "jerusdp"
docker_context = "docker"
orb_context = "orb-publishing"
mcp = true
mcp_context = [
    "release",
    "bot-check",
    "pcu-app",
]
mcp_earliest_version = "0.1.11"
# Orb executor the build_rust_binary CI jobs (build-binary, orb-release-binary)
# compile in. This configures the CI pipeline, not the orb's own container
# ([orb].base_image / builder_image do that). The job default (rust:latest) has
# NO libclang — bindgen fails there (openssl-sys via sequoia-openpgp's OpenSSL
# backend once it pulls the ossl crate, reached transitively through pcu).
# `[ci].rust_image` (a raw pinned image string) was removed by the generator in
# favor of this orb-executor reference (matching gen-circleci-orb's own
# cutover) — rust_image is silently ignored by the current generator, which
# would have dropped libclang from build-binary with no warning. toolkit's
# rust_env_rolling resolves to the exact same digest-pinned
# jerusdp/ci-rust:rolling-6mo image rust_image previously named directly.
build_executor = "toolkit/rust_env_rolling"

# Relocates the regen+record chain off Renovate branches (which it would
# otherwise freeze, gen-circleci-orb#326/#328) and into this repo's existing
# "PR merged"-triggered update_prlog workflow, run last after
# toolkit/update_prlog per the requires-ordering fix in #394, with the
# original validation-workflow chain excluded on qualifying branches per
# #397.
[post_merge_regen]
branch_patterns = ["renovate/*"]
workflow = "update_prlog"
file = "update_prlog.yml"

[subcommand.help]
generate_job = false

# Curated, human-readable run-step names for the orb commands. The labels name
# each command's step inside build_mcp_server (and generate's own standalone
# job); without them the generator falls back to the command's short --help line,
# then the bare name.
#
# generate_job = false suppresses the STANDALONE job for the commands that only
# make sense as steps of build_mcp_server (prime, publish, save) — the commands
# themselves are kept so the composite can still use them. `generate` keeps its
# standalone job: a consumer may validly want to produce an MCP server (source or
# binary) without the full prime/publish/save release flow.
[subcommand.prime]
generate_job = false
label = "Prime prior versions and migrations"

[subcommand.generate]
label = "Generate and compile MCP server"

[subcommand.publish]
generate_job = false
label = "Publish MCP server binary to GitHub release"

[subcommand.save]
generate_job = false
label = "Commit back generated artifacts"

# build's standalone job is suppressed too, for a different reason: it is not used
# inside build_mcp_server (which compiles via `generate --format binary`), and
# standalone `generate --format binary` already produces a binary — so a separate
# build job has no distinct valid CI scenario.
[subcommand.build]
generate_job = false

# build_mcp_server: a goal-oriented composite job assembled from this orb's own
# commands (set_https_remote, prime, generate, publish, save) plus a small git
# setup step. It primes prior-version snapshots, generates and compiles the MCP
# server, publishes the binary to the GitHub release, and commits the generated
# artifacts back to main.
#
# Runs in the orb's `default` executor (the gen-orb-mcp image). When invoked
# with attach_workspace=true it uses a freshly-built binary attached at
# workspace_root (so a release dogfoods its own build); otherwise it falls back
# to the gen-orb-mcp already installed in the image.
[[job_group]]
name = "build_mcp_server"
description = "Prime, generate, compile, publish and commit back the MCP server (composed from the orb's own commands)."

[[job_group.parameter]]
name = "binary_name"
description = "Orb binary name (e.g. gen-orb-mcp); names the generated MCP server and release asset."

[[job_group.parameter]]
name = "tag_prefix"
description = "Git tag prefix for VERSION extraction and prime scoping (e.g. gen-orb-mcp-v)."

[[job_group.parameter]]
name = "orb_path"
default = "orb/src/@orb.yml"
description = "Path to the orb source @orb.yml."

[[job_group.parameter]]
name = "earliest_version"
description = "Earliest orb version to include when priming prior-version snapshots."

[[job_group.parameter]]
name = "prior_versions_dir"
default = "prior-versions"
description = "Directory for prior-version snapshots."

[[job_group.parameter]]
name = "migrations_dir"
default = "migrations"
description = "Directory for migration rule files."

[[job_group.step]]
builtin = "checkout"

[[job_group.step]]
builtin = "attach_workspace"

[[job_group.step]]
run = "Set up git and environment"
script = '''
# Use the freshly-built binary if it was attached from the workspace,
# otherwise fall back to the gen-orb-mcp installed in the image.
if [[ -f "${WORKSPACE_BIN_PATH}/${NAME}" ]]; then
  chmod +x "${WORKSPACE_BIN_PATH}/${NAME}"
  echo "export PATH=${WORKSPACE_BIN_PATH}:\$PATH" >> "$BASH_ENV"
fi
VERSION="${CIRCLE_TAG#${TAG_PREFIX}}"
echo "export VERSION=${VERSION}" >> "$BASH_ENV"
echo "export CIRCLE_BRANCH=main" >> "$BASH_ENV"
git fetch origin main
git checkout -B main origin/main
'''

[job_group.step.environment]
NAME = "<< parameters.binary_name >>"
TAG_PREFIX = "<< parameters.tag_prefix >>"
WORKSPACE_BIN_PATH = "<< parameters.workspace_root >>"

# prime must run BEFORE set_https_remote too: it walks prior version tags via
# `git worktree add`, which on a partial/shallow CircleCI checkout can trigger
# an on-demand fetch from the promisor remote for objects not yet local. That
# fetch needs the same authenticated (SSH-backed) remote the earlier `git
# fetch origin main` used — set_https_remote strips that auth in favour of an
# unauthenticated HTTPS remote (only needed later, for `save`'s push). Running
# prime after set_https_remote breaks on private repos with the same class of
# failure as jerus-org/gen-orb-mcp#266, just one step later.
[[job_group.step]]
command = "prime"

[job_group.step.with]
orb_path = "<< parameters.orb_path >>"
tag_prefix = "<< parameters.tag_prefix >>"
earliest_version = "<< parameters.earliest_version >>"

# Must stay after prime above — see the comment there.
[[job_group.step]]
command = "set_https_remote"

[[job_group.step]]
command = "generate"

# crate_version is intentionally omitted: gen-orb-mcp generate auto-resolves it
# from the latest tag matching tag_prefix, and a runtime $VERSION cannot be
# threaded through an orb parameter. tag_prefix MUST be passed so it resolves
# the crate tag (gen-orb-mcp-v*) and not the workspace/repo tag (v*).
[job_group.step.with]
format = "binary"
generate_name = "<< parameters.binary_name >>"
orb_path = "<< parameters.orb_path >>"
output = "/tmp/mcp-server"
force = "true"
prior_versions = "<< parameters.prior_versions_dir >>"
migrations = "<< parameters.migrations_dir >>"
tag_prefix = "<< parameters.tag_prefix >>"

[[job_group.step]]
command = "publish"

# publish derives the binary path and asset name from the orb name + input dir
# (gen-orb-mcp >= 0.1.38); --tag defaults to $CIRCLE_TAG.
[job_group.step.with]
publish_name = "<< parameters.binary_name >>"
input = "/tmp/mcp-server"

[[job_group.step]]
command = "save"

# save accepts comma-separated paths (gen-orb-mcp >= 0.1.38).
[job_group.step.with]
paths = "<< parameters.prior_versions_dir >>,<< parameters.migrations_dir >>"
sign = "true"
